services:
  postgres:
    image: postgres:16-alpine
    container_name: xtalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xtalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xtalk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-xtalk}
    ports:
      - "5432:5432"
    volumes:
      - xtalk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-xtalk} -d $${POSTGRES_DB:-xtalk}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xtalk-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - xtalk-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  xtalk-pgdata:
  xtalk-redis:
